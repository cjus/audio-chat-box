# cargo-about's settings for solrac-voice's third-party notices: `tools/notices.sh` runs it.
# See https://embark-studios.github.io/cargo-about/

# The licences solrac-voice takes its crates under, in order of preference: for a crate that
# offers a choice ("MIT OR Apache-2.0"), the first one here that it offers. The same licences
# as `deny.toml`'s `allow`, which `cargo deny check` enforces.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MIT-0",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]

# The platforms solrac-voice is built for, as in `deny.toml`. One file covers all three.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# What isn't in the program: build scripts' dependencies (sherpa-onnx's downloader among them)
# and tests'.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Our own crate and the protocol's, which are unpublished: their licences are LICENSE-MIT and
# LICENSE-APACHE.
private = { ignore = true }

# cargo-about's own fixes for crates whose licence files it can't read on its own.
workarounds = ["ring"]
